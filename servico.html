 "Cabelo", "icon": "◇", "description": "Realinhamento capilar com escova.", "label": "Indicação", "extra": "Para quem deseja reduzir volume e facilitar a finalização.", "price": "R$ 150", "button": "Agendar meu horário", "message": "Olá! Quero agendar Realinhamento na Loyal Barbearia."}]};const key=new URLSearchParams(location.search).get('servico')||'corte-masculino';const items=data[key]||data['corte-masculino'];document.getElementById('content').innerHTML=items.map(x=>{const msg=encodeURIComponent(x.message);return `<article class="card"><div class="visual">${x.icon}</div><div class="category">${x.category}</div><h2>${x.name}</h2><p>${x.description}</p><div class="info"><strong>${x.label}</strong><br>${x.extra}</div><div class="price">${x.price}</div><a class="btn" target="_blank" rel="noopener noreferrer" href="https://wa.me/${whatsapp}?text=${msg}">${x.button}</a></article>`}).join('');</script></body></html>
